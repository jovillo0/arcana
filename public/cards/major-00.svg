      <stop offset=".58" stop-color="#17212a"/>
      <stop offset="1" stop-color="#3a3030"/>
    </linearGradient>
    <linearGradient id="haze" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#b8b2a0" stop-opacity="0"/>
      <stop offset=".55" stop-color="#b8b2a0" stop-opacity=".15"/>
      <stop offset="1" stop-color="#b8b2a0" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="far-ground" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#343237"/>
      <stop offset="1" stop-color="#24252a"/>
    </linearGradient>
    <linearGradient id="near-ground" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#45332e"/>
      <stop offset=".48" stop-color="#30272a"/>
      <stop offset="1" stop-color="#141b20"/>
    </linearGradient>
    <linearGradient id="seed" x1=".15" y1="0" x2=".85" y2="1">
