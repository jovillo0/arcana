<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">El Loco — paisaje de posibilidad</title>
  <desc id="desc">Una semilla pequeña sobre una extensión de tierra oscura; al fondo, un horizonte brumoso bajo un cielo abierto y un punto distante de luz.</desc>
  <defs>
