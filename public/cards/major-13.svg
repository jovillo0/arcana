<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">La Muerte — fractura y umbral</title>
  <desc id="desc">Una grieta de luz parte una masa de piedra oscura. Fragmentos de una estructura anterior se hunden en sombra, mientras un brote pequeño aparece entre las rocas.</desc>
