<svg xmlns="http://www.w3.org/2000/svg" width="400" height="560" viewBox="0 0 400 560" role="img" aria-labelledby="title desc">
  <title id="title">La Muerte — estudio compositivo</title>
  <desc id="desc">Un círculo oscuro cruza un umbral; una crisálida vacía y una hoja seca acompañan un brote frente a una luz estrecha.</desc>
