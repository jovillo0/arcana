      <stop stop-color="#0a1218"/>
      <stop offset=".52" stop-color="#211a20"/>
      <stop offset="1" stop-color="#0b1419"/>
    </linearGradient>
    <linearGradient id="rock" x1="0" y1="0" x2=".9" y2="1">
      <stop stop-color="#373236"/>
      <stop offset=".37" stop-color="#27292b"/>
      <stop offset=".72" stop-color="#171e22"/>
      <stop offset="1" stop-color="#30282a"/>
    </linearGradient>
    <linearGradient id="rock-face" x1="0" y1="0" x2="1" y2=".35">
      <stop stop-color="#4a3c38"/>
      <stop offset=".48" stop-color="#242629"/>
      <stop offset="1" stop-color="#131a1e"/>
    </linearGradient>
    <linearGradient id="fracture" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#dbc596" stop-opacity=".02"/>
      <stop offset=".38" stop-color="#c4b185" stop-opacity=".18"/>
      <stop offset=".5" stop-color="#f0e7d0" stop-opacity=".94"/>
      <stop offset=".62" stop-color="#b8a981" stop-opacity=".2"/>
      <stop offset="1" stop-color="#8a9a8e" stop-opacity=".02"/>
    </linearGradient>
    <radialGradient id="far-light" cx=".52" cy=".52" r=".6">
      <stop stop-color="#cfc5a8" stop-opacity=".17"/>
      <stop offset="1" stop-color="#cfc5a8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="strata" width="69" height="55" patternUnits="userSpaceOnUse">
      <path d="M3 12c12-5 21-5 31-1m20 19c8-3 13-3 19-1M13 48c11-4 19-4 28-1" fill="none" stroke="#b4a58e" stroke-opacity=".12" stroke-width="1"/>
      <path d="m44 7 4-2m-37 25 5-2m38 19 4-1" stroke="#11181c" stroke-opacity=".5" stroke-width="2"/>
    </pattern>
    <clipPath id="stone-mass">
