      <stop offset=".48" stop-color="#12181c"/>
      <stop offset=".53" stop-color="#dbc596" stop-opacity=".74"/>
      <stop offset=".56" stop-color="#65705e" stop-opacity=".38"/>
      <stop offset="1" stop-color="#090f15"/>
    </linearGradient>
    <linearGradient id="threshold" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#dbc596" stop-opacity=".54"/>
      <stop offset="1" stop-color="#dbc596" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="dawn" cx=".5" cy=".55" r=".55">
      <stop stop-color="#dbc596" stop-opacity=".2"/>
      <stop offset="1" stop-color="#dbc596" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grain" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M4 8h1M21 27h1M30 12h1M12 19h1" stroke="#d5be8f" stroke-opacity=".09" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="400" height="560" fill="url(#field)"/>
